apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello-world

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - poddisruptionbudget.yaml

# includeSelectors keeps these in the Deployment's matchLabels, matching what the
# deprecated commonLabels did. It must stay true: spec.selector is immutable, so
# flipping it would break `kubectl apply` against an already-deployed cluster.
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: hello-world
      app.kubernetes.io/managed-by: kustomize

# `kustomize edit set image` in the pipeline rewrites this per build.
images:
  - name: ghcr.io/sriindus/hello-world-frontend
    newTag: latest
