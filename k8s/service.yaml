apiVersion: v1
kind: Service
metadata:
  name: hello-world-frontend
  namespace: hello-world
  labels:
    app.kubernetes.io/name: hello-world-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hello-world-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
